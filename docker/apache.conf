<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # None, not All. The container is immutable and WordPress cannot write
        # an .htaccess, so AllowOverride only costs a stat on every request for
        # a file that will never exist. The rules it would have contained are
        # below instead.
        AllowOverride None
        Require all granted

        # WordPress's own rewrite rules, verbatim, because pretty permalinks
        # are not cosmetic here: /wp-json only resolves through them, so
        # without these the entire read API 404s while the admin looks
        # perfectly healthy.
        RewriteEngine On
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>

    # Nothing outside the webroot is reachable, but say so explicitly: vendor/
    # and src/ sit beside it and a misconfigured DocumentRoot would otherwise
    # serve composer.lock and the plugin source.
    <DirectoryMatch "^/var/www/html/(vendor|src)">
        Require all denied
    </DirectoryMatch>

    # This install is a CMS, not a website. The front end is a separate service.
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Cloud Run already logs the request line; Apache's own access log would
    # double every entry in Cloud Logging and double the log bill with it.
    ErrorLog /dev/stderr
    CustomLog /dev/null combined
</VirtualHost>
