opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192

; WordPress core plus the plugin is well over the 10000 default, and silently
; exceeding it evicts files at random rather than erroring.
opcache.max_accelerated_files=30000
opcache.interned_strings_buffer=16

; The image is immutable, so a file cannot change under a running process and
; there is nothing to gain from stat-ing every include on every request.
opcache.validate_timestamps=0

; NOT 0. Several plugins, Carbon Fields among them, read docblocks at runtime.
; Stripping comments saves a little memory and breaks them in ways that surface
; a long way from the cause.
opcache.save_comments=1

; No JIT: no measurable win for a request-per-page workload, real memory cost.
opcache.jit=disable

; Matters more than usual here, because part of the tree is a FUSE mount where
; every uncached stat is a network round trip.
realpath_cache_size=4096k
realpath_cache_ttl=600
